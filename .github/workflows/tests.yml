name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r api/requirements.txt -r engine/requirements.txt -r api/requirements-dev.txt

      # No network is needed. The GHCN station bundle is committed, the engine
      # tests run on synthetic records, and the storefront tests use a temporary
      # database with fitting stubbed out --- so a NOAA outage cannot turn CI red.
      - name: Run the suite
        run: python -m pytest engine/tests api/tests -q

      - name: Check the station bundle loads
        run: |
          python -c "
          from api import stations
          idx = stations.load_index()
          assert len(idx) > 20000, 'station bundle looks wrong'
          m = stations.nearest_station(42.3601, -71.0589, 6.0)
          assert m and m.station_id == 'USW00014739', f'Boston matched {m}'
          print(f'station bundle OK: {len(idx):,} stations, Boston -> {m.station_id}')
          "
