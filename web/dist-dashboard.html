<title>Downside — Weather Risk Terminal</title>
<style>
:root{
  color-scheme:light;
  --ground:#F4F6F7; --panel:#FFFFFF; --panel-2:#EDF0F2; --panel-3:#E3E8EB;
  --ink:#0F171D; --ink-2:#41525F; --muted:#6B7C8A;
  --rule:rgba(15,23,29,.14); --rule-soft:rgba(15,23,29,.07);
  --accent:#B4531F; --accent-soft:rgba(180,83,31,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --grid:rgba(15,23,29,.09);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --shadow:0 1px 2px rgba(15,23,29,.06),0 10px 30px -16px rgba(15,23,29,.28);
  --canvas-alpha:.34;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --ground:#080D12; --panel:#0F161D; --panel-2:#16202A; --panel-3:#1E2A35;
  --ink:#E6EDF3; --ink-2:#9FB0BE; --muted:#6B7C8A;
  --rule:rgba(230,237,243,.14); --rule-soft:rgba(230,237,243,.07);
  --accent:#E8974A; --accent-soft:rgba(232,151,74,.13);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --grid:rgba(230,237,243,.10);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 40px -18px rgba(0,0,0,.85);
  --canvas-alpha:.5;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#080D12; --panel:#0F161D; --panel-2:#16202A; --panel-3:#1E2A35;
  --ink:#E6EDF3; --ink-2:#9FB0BE; --muted:#6B7C8A;
  --rule:rgba(230,237,243,.14); --rule-soft:rgba(230,237,243,.07);
  --accent:#E8974A; --accent-soft:rgba(232,151,74,.13);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --grid:rgba(230,237,243,.10);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 40px -18px rgba(0,0,0,.85);
  --canvas-alpha:.5;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#sky{
  position:fixed;inset:0;width:100%;height:100%;z-index:0;
  opacity:var(--canvas-alpha);pointer-events:none;
  transition:opacity .6s ease;
}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:14px 22px;border-bottom:1px solid var(--rule);
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  backdrop-filter:blur(14px);position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-size:17px;font-weight:740;letter-spacing:-.02em}
.brand span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:640}
.ctl{display:flex;align-items:center;gap:8px}
.ctl label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:640}
select,button{
  font:inherit;font-size:13px;color:var(--ink);background:var(--panel-2);
  border:1px solid var(--rule);border-radius:3px;padding:6px 10px;cursor:pointer;
}
select:hover,button:hover{background:var(--panel-3)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,.tab:focus-visible,.loc:focus-visible
{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:212px 1fr;flex:1;min-height:0}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
.rail{
  border-right:1px solid var(--rule);padding:14px 0;
  background:color-mix(in srgb,var(--panel) 60%,transparent);
}
@media (max-width:900px){.rail{
  border-right:none;border-bottom:1px solid var(--rule);
  display:flex;overflow-x:auto;padding:10px;gap:8px;
}}
.rail h3{
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  margin:0 0 8px;padding:0 16px;font-weight:660;
}
@media (max-width:900px){.rail h3{display:none}}
.loc{
  display:block;width:100%;text-align:left;border:none;border-left:2px solid transparent;
  background:none;border-radius:0;padding:8px 16px;cursor:pointer;
}
@media (max-width:900px){.loc{
  flex:0 0 auto;border:1px solid var(--rule);border-radius:3px;padding:7px 12px;
}}
.loc:hover{background:var(--panel-2)}
.loc[aria-pressed="true"]{border-left-color:var(--accent);background:var(--accent-soft)}
@media (max-width:900px){.loc[aria-pressed="true"]{border-color:var(--accent)}}
.loc .n{display:block;font-size:13px;font-weight:600;letter-spacing:-.01em}
.loc .v{display:block;font-size:11px;color:var(--muted);margin-top:1px}
@media (max-width:900px){.loc .v{display:none}}

/* Bottom padding clears the sticky scrubber so nothing sits permanently under it. */
main{padding:20px 24px 72px;min-width:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin-bottom:20px}
.tab{
  border:none;background:none;border-radius:0;padding:9px 14px;
  border-bottom:2px solid transparent;color:var(--ink-2);font-size:13.5px;font-weight:560;
}
.tab:hover{color:var(--ink);background:var(--panel-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:660}

/* ---------- view head ---------- */
.vhead{margin-bottom:18px}
h1{font-size:clamp(21px,3vw,29px);font-weight:730;letter-spacing:-.026em;margin:0;text-wrap:balance}
.vhead p{margin:7px 0 0;color:var(--ink-2);max-width:74ch}
.vhead p strong{color:var(--ink);font-weight:640}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.card{
  background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--rule);border-radius:4px;padding:15px 16px;box-shadow:var(--shadow);
}
.card h4{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:0 0 10px;font-weight:660;
}
.card .big{font-size:27px;font-weight:720;letter-spacing:-.028em;font-variant-numeric:tabular-nums;line-height:1.05}
.card .big .u{font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.card .sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.42}
.card figcaption{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}

.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:640;
  padding:2px 8px;border-radius:999px;border:1px solid currentColor;letter-spacing:.01em;
}
.pill.ok{color:var(--good)} .pill.warn{color:var(--serious)} .pill.bad{color:var(--crit)}
.pill.info{color:var(--muted)}

svg{display:block;width:100%;height:auto;overflow:visible}
.axis{font-size:10.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.gridline{stroke:var(--grid);stroke-width:1}
.axisline{stroke:var(--rule);stroke-width:1}
.slab{font-size:11px;font-weight:660;font-variant-numeric:tabular-nums}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto}

.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
th{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:650;background:var(--panel-2)}
td{font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
tbody tr:hover{background:var(--panel-2)}

/* ---------- scrubber ---------- */
.scrub{
  position:sticky;bottom:0;z-index:15;margin-top:24px;
  border-top:1px solid var(--rule);padding:11px 22px;
  background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(14px);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.scrub .lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:640}
.scrub .yr{font-size:22px;font-weight:730;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:3.4ch}
input[type=range]{
  flex:1;min-width:180px;accent-color:var(--accent);height:22px;cursor:pointer;background:transparent;
}
.readout{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.readout b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:660}

.note{
  border-left:2px solid var(--accent);background:color-mix(in srgb,var(--panel) 88%,transparent);
  padding:12px 15px;font-size:13px;color:var(--ink-2);border-radius:0 3px 3px 0;
}
.note b{color:var(--ink)}
.prov{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}

.fade-in{animation:fi .45s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade-in{animation:none}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<div id="app">
  <header>
    <div class="brand"><b>Downside</b><span>Weather Risk Terminal</span></div>
    <div class="ctl">
      <label for="scenario">Pathway</label>
      <select id="scenario"></select>
    </div>
    <div class="ctl">
      <label for="theme">Theme</label>
      <button id="theme" type="button">Auto</button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail"><h3>Portfolio</h3></nav>
    <main>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div id="view"></div>
    </main>
  </div>

  <div class="scrub">
    <span class="lab">Target year</span>
    <span class="yr" id="yearOut">2027</span>
    <input type="range" id="year" min="0" max="5" step="1" value="0" aria-label="Target year">
    <div class="readout" id="readout"></div>
  </div>
</div>

<script type="module">
/* Ambient weather renderer.
 *
 * This is not a decorative loop. Every parameter it draws comes from the same
 * simulation that produces the charts: `ambient[scenario][year]` carries wet
 * fraction, heavy-rain fraction, snow fraction, windy fraction, hot fraction and
 * mean temperature for the selected site, year and pathway.
 *
 * So moving the year scrubber to 2125 under SSP5-8.5 thins the rain and hardens
 * the light because the model says it does. The backdrop and the numbers are the
 * same finding rendered twice.
 *
 * State changes are eased rather than cut, so a scenario switch reads as a
 * climate drifting rather than a slide transition.
 */

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

const TARGET = {
  wet: 0, heavy: 0, snow: 0, windy: 0, hot: 0, tmax: 15, wind: 4,
};

class WeatherCanvas {
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: true });
    this.state = { ...TARGET };
    this.target = { ...TARGET };
    this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.intensity = opts.intensity ?? 1;
    this.running = false;
    this.t = 0;
    this.flash = 0;
    this.nextFlash = 400;

    this.rain = [];
    this.snow = [];
    this.gust = [];
    this.MAX_RAIN = 340;
    this.MAX_SNOW = 260;
    this.MAX_GUST = 40;

    this._resize = this._resize.bind(this);
    this._frame = this._frame.bind(this);
    this._resize();
    addEventListener('resize', this._resize, { passive: true });
  }

  _resize() {
    const r = this.canvas.getBoundingClientRect();
    // Cap the backing store: this layer sits behind the whole app and a 3x
    // buffer on a large monitor costs more than the effect is worth.
    const dpr = Math.min(devicePixelRatio || 1, 2);
    this.w = Math.max(r.width, 1);
    this.h = Math.max(r.height, 1);
    this.canvas.width = Math.round(this.w * dpr);
    this.canvas.height = Math.round(this.h * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  set(next) {
    Object.assign(this.target, next);
    if (this.reduced) Object.assign(this.state, next);
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.last = performance.now();
    requestAnimationFrame(this._frame);
  }

  stop() { this.running = false; }

  _spawnRain() {
    return {
      x: Math.random() * (this.w + 260) - 130,
      y: Math.random() * -this.h,
      len: 8 + Math.random() * 16,
      v: 480 + Math.random() * 520,
      a: 0.16 + Math.random() * 0.34,
    };
  }

  _spawnSnow() {
    return {
      x: Math.random() * this.w,
      y: Math.random() * -this.h,
      r: 0.9 + Math.random() * 2.1,
      v: 22 + Math.random() * 46,
      drift: Math.random() * Math.PI * 2,
      sway: 0.4 + Math.random() * 1.1,
      a: 0.25 + Math.random() * 0.5,
    };
  }

  _spawnGust() {
    return {
      x: Math.random() * this.w,
      y: Math.random() * this.h,
      len: 40 + Math.random() * 130,
      v: 150 + Math.random() * 320,
      a: 0.05 + Math.random() * 0.13,
    };
  }

  _frame(now) {
    if (!this.running) return;
    const dt = Math.min((now - this.last) / 1000, 0.05);
    this.last = now;
    this.t += dt;

    // Ease the visible state toward the target so a scenario change reads as a
    // climate drifting rather than a hard cut.
    const k = 1 - Math.pow(0.0016, dt);
    for (const key in this.target) {
      this.state[key] = lerp(this.state[key], this.target[key], k);
    }

    this._draw(dt);
    requestAnimationFrame(this._frame);
  }

  _draw(dt) {
    const { ctx, w, h, state } = this;
    ctx.clearRect(0, 0, w, h);

    const wind = clamp(state.wind / 12, 0, 1);
    const slant = lerp(0.06, 0.62, wind) * (1 + state.windy * 0.8);

    this._drawSky();
    this._drawSun();

    const g = this.intensity;

    // --- rain -------------------------------------------------------------
    const wantRain = Math.round(this.MAX_RAIN * clamp(state.wet * (0.5 + state.heavy * 2.4), 0, 1) * g);
    while (this.rain.length < wantRain) this.rain.push(this._spawnRain());
    if (this.rain.length > wantRain) this.rain.length = wantRain;

    if (this.rain.length) {
      ctx.lineCap = 'round';
      ctx.strokeStyle = this.rainColor;
      ctx.lineWidth = 1.05;
      ctx.beginPath();
      for (const p of this.rain) {
        if (!this.reduced) {
          p.y += p.v * dt;
          p.x += p.v * dt * slant;
        }
        if (p.y > h + 20 || p.x > w + 140) { Object.assign(p, this._spawnRain()); p.y = -20; }
        ctx.globalAlpha = p.a;
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.len * slant, p.y - p.len);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // --- snow -------------------------------------------------------------
    const wantSnow = Math.round(this.MAX_SNOW * clamp(state.snow * 2.6, 0, 1) * g);
    while (this.snow.length < wantSnow) this.snow.push(this._spawnSnow());
    if (this.snow.length > wantSnow) this.snow.length = wantSnow;

    if (this.snow.length) {
      ctx.fillStyle = this.snowColor;
      for (const p of this.snow) {
        if (!this.reduced) {
          p.y += p.v * dt;
          p.drift += dt * p.sway;
          p.x += (Math.sin(p.drift) * 14 + wind * 90) * dt;
        }
        if (p.y > h + 8) { Object.assign(p, this._spawnSnow()); p.y = -8; }
        if (p.x > w + 8) p.x = -8;
        if (p.x < -8) p.x = w + 8;
        ctx.globalAlpha = p.a;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // --- wind streaks -------------------------------------------------------
    const wantGust = Math.round(this.MAX_GUST * clamp(state.windy * 2.2, 0, 1) * g);
    while (this.gust.length < wantGust) this.gust.push(this._spawnGust());
    if (this.gust.length > wantGust) this.gust.length = wantGust;

    if (this.gust.length) {
      ctx.strokeStyle = this.gustColor;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (const p of this.gust) {
        if (!this.reduced) p.x += p.v * dt;
        if (p.x - p.len > w) { Object.assign(p, this._spawnGust()); p.x = -p.len; }
        ctx.globalAlpha = p.a;
        const yy = p.y + Math.sin(this.t * 0.7 + p.y) * 5;
        ctx.moveTo(p.x - p.len, yy);
        ctx.lineTo(p.x, yy);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    this._drawLightning(dt);
  }

  _drawSky() {
    const { ctx, w, h, state } = this;
    // Warmth of the ground follows mean daily maximum.
    const warm = clamp((state.tmax - 4) / 34, 0, 1);
    const grd = ctx.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, this.skyTop(warm));
    grd.addColorStop(1, this.skyBottom(warm));
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, w, h);
  }

  _drawSun() {
    const { ctx, w, h, state } = this;
    const heat = clamp(state.hot, 0, 1);
    // Overcast suppresses the disc; heat sharpens it.
    const clear = clamp(1 - state.wet * 1.5, 0, 1);
    const power = heat * 0.75 + clear * 0.25;
    if (power < 0.03) return;

    const cx = w * 0.78;
    const cy = h * 0.22;
    const pulse = this.reduced ? 0 : Math.sin(this.t * 0.5) * 0.04;
    const rad = Math.min(w, h) * (0.42 + heat * 0.3 + pulse);

    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    grd.addColorStop(0, this.sunCore(power));
    grd.addColorStop(0.45, this.sunMid(power));
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, w, h);

    // Heat shimmer: only when it is genuinely hot, so it reads as a signal.
    if (heat > 0.35 && !this.reduced) {
      ctx.save();
      ctx.globalAlpha = (heat - 0.35) * 0.16;
      ctx.strokeStyle = this.sunCore(1);
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 7; i++) {
        const yy = h * (0.55 + i * 0.06);
        ctx.moveTo(0, yy);
        for (let x = 0; x <= w; x += 26) {
          ctx.lineTo(x, yy + Math.sin(x * 0.02 + this.t * 1.6 + i) * 3.2);
        }
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  _drawLightning(dt) {
    const { ctx, w, h, state } = this;
    if (this.reduced) return;
    // Strike rate scales with heavy-rain fraction; nothing fires in a dry year.
    const rate = clamp(state.heavy * 2.2, 0, 1);
    if (rate > 0.02) {
      this.nextFlash -= dt * 1000 * rate;
      if (this.nextFlash <= 0) {
        this.flash = 1;
        this.nextFlash = 2600 + Math.random() * 7000;
      }
    }
    if (this.flash > 0) {
      this.flash = Math.max(0, this.flash - dt * 3.4);
      const a = Math.pow(this.flash, 3) * 0.4;
      ctx.fillStyle = `rgba(190,215,255,${a})`;
      ctx.fillRect(0, 0, w, h);
    }
  }

  /* --- palette hooks, overridden per theme -------------------------------- */
  get rainColor() { return this.dark ? 'rgba(150,190,225,0.85)' : 'rgba(70,110,150,0.6)'; }
  get snowColor() { return this.dark ? 'rgba(226,240,252,0.95)' : 'rgba(150,180,210,0.8)'; }
  get gustColor() { return this.dark ? 'rgba(180,205,230,0.5)' : 'rgba(90,130,170,0.4)'; }

  skyTop(warm) {
    return this.dark
      ? `rgba(${Math.round(lerp(14, 52, warm))},${Math.round(lerp(26, 30, warm))},${Math.round(lerp(42, 30, warm))},0.85)`
      : `rgba(${Math.round(lerp(206, 246, warm))},${Math.round(lerp(224, 226, warm))},${Math.round(lerp(240, 205, warm))},0.85)`;
  }
  skyBottom(warm) {
    return this.dark
      ? `rgba(${Math.round(lerp(8, 26, warm))},${Math.round(lerp(13, 15, warm))},${Math.round(lerp(18, 16, warm))},0.4)`
      : `rgba(${Math.round(lerp(238, 252, warm))},${Math.round(lerp(243, 242, warm))},${Math.round(lerp(248, 232, warm))},0.5)`;
  }
  sunCore(p) {
    return this.dark ? `rgba(255,186,110,${0.20 * p})` : `rgba(255,198,120,${0.30 * p})`;
  }
  sunMid(p) {
    return this.dark ? `rgba(232,151,74,${0.07 * p})` : `rgba(240,170,90,${0.12 * p})`;
  }

  get dark() {
    const stamp = document.documentElement.getAttribute('data-theme');
    if (stamp === 'dark') return true;
    if (stamp === 'light') return false;
    return matchMedia('(prefers-color-scheme: dark)').matches;
  }
}


const D = JSON.parse(document.getElementById('payload').textContent);
const NS='http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SC_COL = {ssp126:'var(--s3)',ssp245:'var(--s1)',ssp370:'var(--s4)',ssp585:'var(--s2)'};

const state = {
  loc: D.locations[0],
  scenario: 'ssp245',
  yearIdx: 0,
  tab: 'overview',
};

const money = n => {
  const a = Math.abs(n);
  if (a >= 1e6) return '$'+(n/1e6).toFixed(2)+'M';
  if (a >= 1e3) return '$'+(n/1e3).toFixed(0)+'k';
  return '$'+n.toFixed(0);
};
const pct = (n,d=0) => (n*100).toFixed(d)+'%';
const f = (n,d=1) => Number(n).toFixed(d);

/* ---------- svg helpers ---------- */
function E(tag,attrs={},parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function SVG(w,h){
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox',`0 0 ${w} ${h}`); s.setAttribute('role','img');
  return s;
}
const sc=(d0,d1,r0,r1)=>{const k=(r1-r0)/((d1-d0)||1);return v=>r0+(v-d0)*k;};
const P=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ');
function drawIn(node,el){node.innerHTML='';node.appendChild(el);}
function animPath(p){
  if(reduce) return;
  const L=p.getTotalLength();
  p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
  p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],
    {duration:1100,easing:'cubic-bezier(.4,.1,.2,1)',fill:'forwards'});
}

/* ---------- weather canvas ---------- */
const sky = new WeatherCanvas(document.getElementById('sky'));
sky.start();
function pushWeather(){
  const rows = state.loc.ambient?.[state.scenario];
  if(!rows) return;
  const a = rows[Math.min(state.yearIdx, rows.length-1)];
  sky.set({
    wet:a.wet_frac, heavy:a.heavy_frac, snow:a.snow_frac,
    windy:a.windy_frac, hot:a.hot_frac, tmax:a.tmax, wind:a.wind,
  });
  const r=document.getElementById('readout');
  r.innerHTML =
    `<span>Mean high <b>${f(a.tmax,1)}°C</b></span>`+
    `<span>Wet days <b>${pct(a.wet_frac)}</b></span>`+
    (a.snow_frac>0.01?`<span>Snow days <b>${pct(a.snow_frac)}</b></span>`:'')+
    `<span>Days &gt;32°C <b>${pct(a.hot_frac)}</b></span>`+
    `<span>Windy <b>${pct(a.windy_frac)}</b></span>`;
}

/* ---------- chrome ---------- */
(function chrome(){
  const sel=document.getElementById('scenario');
  D.scenarios.forEach(s=>{
    const o=document.createElement('option');
    o.value=s.id; o.textContent=s.short; o.selected=s.id===state.scenario;
    sel.appendChild(o);
  });
  sel.onchange=e=>{state.scenario=e.target.value;pushWeather();render();};

  const rail=document.getElementById('rail');
  D.locations.forEach(l=>{
    const b=document.createElement('button');
    b.className='loc'; b.type='button';
    b.setAttribute('aria-pressed', l.id===state.loc.id);
    const bad=l.quality&&!l.quality.usable;
    const mark=bad?` <span style="color:var(--${l.quality.verdict==='unreliable'?'crit':'serious'})"
      title="${l.quality.problems.join(' ')}">&#9679;</span>`:'';
    b.innerHTML=`<span class="n">${l.name.split(',')[0]}${mark}</span><span class="v">${l.vertical}</span>`;
    b.onclick=()=>{
      state.loc=l;
      rail.querySelectorAll('.loc').forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      pushWeather(); render();
    };
    rail.appendChild(b);
  });

  const TABS=[['overview','Overview'],['climate','Climate'],['outlook','Outlook'],
              ['perils','Perils'],['pricing','Pricing'],['hedge','Hedging'],['model','Model']];
  const tabs=document.getElementById('tabs');
  TABS.forEach(([id,label])=>{
    const b=document.createElement('button');
    b.className='tab'; b.type='button'; b.role='tab'; b.textContent=label;
    b.setAttribute('aria-selected', id===state.tab);
    b.onclick=()=>{
      state.tab=id;
      tabs.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));
      b.setAttribute('aria-selected','true'); render();
    };
    tabs.appendChild(b);
  });

  const yr=document.getElementById('year');
  yr.max=D.locations[0].target_years.length-1;
  yr.oninput=e=>{
    state.yearIdx=+e.target.value;
    document.getElementById('yearOut').textContent=state.loc.target_years[state.yearIdx];
    pushWeather(); render();
  };

  const tb=document.getElementById('theme');
  const cycle=['Auto','Light','Dark'];
  let ti=0;
  tb.onclick=()=>{
    ti=(ti+1)%3; tb.textContent=cycle[ti];
    const root=document.documentElement;
    if(ti===0) root.removeAttribute('data-theme');
    else root.setAttribute('data-theme',cycle[ti].toLowerCase());
  };
})();

/* ================= CHARTS ================= */

function drawHistory(host,L,W,H){
  const M={t:12,r:52,b:26,l:38};
  const s=SVG(W,H);
  const hist=L.history, fit=L.fitted;
  const vals=hist.map(d=>d.tmax).concat(fit.map(d=>d.tmax));
  const x=sc(hist[0].year,hist[hist.length-1].year,M.l,W-M.r);
  const lo=Math.min(...vals)-.4, hi=Math.max(...vals)+.4;
  const y=sc(lo,hi,H-M.b,M.t);
  const tk=ticks(lo,hi,4);
  tk.forEach(t=>{
    E('line',{x1:M.l,x2:W-M.r,y1:y(t),y2:y(t),class:'gridline'},s);
    E('text',{x:M.l-7,y:y(t)+4,class:'axis','text-anchor':'end'},s).textContent=fmtTick(t,tk.step);
  });
  [1940,1970,2000].forEach(yr=>E('text',{x:x(yr),y:H-M.b+16,class:'axis','text-anchor':'middle'},s).textContent=yr);
  E('line',{x1:M.l,x2:W-M.r,y1:H-M.b,y2:H-M.b,class:'axisline'},s);
  E('path',{d:P(hist.map(d=>[x(d.year),y(d.tmax)])),fill:'none',stroke:'var(--s1)',
    'stroke-width':1,'stroke-opacity':.5},s);
  const p=E('path',{d:P(fit.map(d=>[x(d.year),y(d.tmax)])),fill:'none',stroke:'var(--accent)',
    'stroke-width':2.3,'stroke-linecap':'round'},s);
  animPath(p);
  let yf=y(fit[fit.length-1].tmax), yo=y(hist[hist.length-1].tmax);
  if(Math.abs(yf-yo)<14){const m=(yf+yo)/2; yf=m-7; yo=m+7;}
  E('text',{x:W-M.r+6,y:yf+4,class:'slab',fill:'var(--accent)'},s).textContent='fitted';
  E('text',{x:W-M.r+6,y:yo+4,class:'slab',fill:'var(--s1)'},s).textContent='observed';
  drawIn(host,s);
}

function drawStripes(host,L,W,H){
  const s=SVG(W,H);
  const h=L.history, base=h.slice(0,30).reduce((a,d)=>a+d.tmax,0)/30;
  const an=h.map(d=>d.tmax-base);
  const mx=Math.max(...an.map(Math.abs))||1;
  const bw=(W)/h.length;
  h.forEach((d,i)=>{
    const t=(d.tmax-base)/mx;
    const col=t>=0?`rgba(217,89,38,${.18+.82*Math.min(t,1)})`
                  :`rgba(57,135,229,${.18+.82*Math.min(-t,1)})`;
    const r=E('rect',{x:i*bw,y:0,width:Math.ceil(bw)+.5,height:H-18,fill:col},s);
    if(!reduce) r.animate([{opacity:0},{opacity:1}],{duration:500,delay:i*5,fill:'backwards'});
  });
  E('text',{x:0,y:H-4,class:'axis'},s).textContent=h[0].year;
  E('text',{x:W,y:H-4,class:'axis','text-anchor':'end'},s).textContent=h[h.length-1].year;
  drawIn(host,s);
}

function drawPrecip(host,L,W,H){
  const M={t:12,r:14,b:26,l:46};
  const s=SVG(W,H), h=L.history;
  const x=sc(h[0].year,h[h.length-1].year,M.l,W-M.r);
  const hi=Math.max(...h.map(d=>d.precip))*1.05;
  const y=sc(0,hi,H-M.b,M.t);
  const tk=ticks(0,hi,4);
  tk.forEach(t=>{
    E('line',{x1:M.l,x2:W-M.r,y1:y(t),y2:y(t),class:'gridline'},s);
    E('text',{x:M.l-7,y:y(t)+4,class:'axis','text-anchor':'end'},s).textContent=fmtTick(t,tk.step);
  });
  const bw=Math.max((W-M.l-M.r)/h.length-0.6,0.8);
  h.forEach((d,i)=>E('rect',{x:x(d.year)-bw/2,y:y(d.precip),width:bw,
    height:(H-M.b)-y(d.precip),fill:'var(--s1)','fill-opacity':.55},s));
  // 10-year moving average
  const ma=h.map((d,i)=>{const w=h.slice(Math.max(0,i-9),i+1);
    return [x(d.year), y(w.reduce((a,b)=>a+b.precip,0)/w.length)];});
  E('path',{d:P(ma.slice(9)),fill:'none',stroke:'var(--accent)','stroke-width':2},s);
  E('line',{x1:M.l,x2:W-M.r,y1:H-M.b,y2:H-M.b,class:'axisline'},s);
  E('text',{x:M.l,y:H-6,class:'axis'},s).textContent='mm/yr · line = 10-yr mean';
  drawIn(host,s);
}

function drawFan(host,L,W,H,leg){
  const M={t:14,r:92,b:26,l:40};
  const s=SVG(W,H);
  let lo=1e9,hi=-1e9;
  D.scenarios.forEach(x=>L.projection[x.id].forEach(d=>{lo=Math.min(lo,d.lo);hi=Math.max(hi,d.hi);}));
  const rows=L.projection.ssp245;
  const x=sc(rows[0].year,rows[rows.length-1].year,M.l,W-M.r);
  const y=sc(lo-.3,hi+.3,H-M.b,M.t);
  const tk=ticks(lo,hi,5);
  tk.forEach(t=>{
    E('line',{x1:M.l,x2:W-M.r,y1:y(t),y2:y(t),class:'gridline'},s);
    E('text',{x:M.l-7,y:y(t)+4,class:'axis','text-anchor':'end'},s).textContent=fmtTick(t,tk.step);
  });
  [2050,2075,2100,2125].forEach(yr=>E('text',{x:x(yr),y:H-M.b+16,class:'axis','text-anchor':'middle'},s).textContent=yr);
  E('line',{x1:M.l,x2:W-M.r,y1:H-M.b,y2:H-M.b,class:'axisline'},s);

  const band=L.projection[state.scenario];
  E('path',{d:P(band.map(d=>[x(d.year),y(d.hi)]).concat(
      band.slice().reverse().map(d=>[x(d.year),y(d.lo)])))+'Z',
    fill:SC_COL[state.scenario],'fill-opacity':.13},s);

  D.scenarios.forEach((s2,i)=>{
    const r=L.projection[s2.id];
    const p=E('path',{d:P(r.map(d=>[x(d.year),y(d.mean)])),fill:'none',stroke:SC_COL[s2.id],
      'stroke-width':s2.id===state.scenario?2.6:1.6,
      'stroke-opacity':s2.id===state.scenario?1:.75,'stroke-linecap':'round'},s);
    animPath(p);
    E('text',{x:W-M.r+6,y:y(r[r.length-1].mean)+4,class:'slab',fill:SC_COL[s2.id]},s)
      .textContent=s2.short;
  });
  // marker for the selected target year
  const ty=L.target_years[state.yearIdx];
  if(ty>=rows[0].year){
    E('line',{x1:x(ty),x2:x(ty),y1:M.t,y2:H-M.b,stroke:'var(--ink)','stroke-width':1.2,
      'stroke-dasharray':'3 3','stroke-opacity':.55},s);
    E('text',{x:x(ty)+5,y:M.t+11,class:'axis',fill:'var(--ink)'},s).textContent=ty;
  }
  drawIn(host,s);
  if(leg){leg.innerHTML='';D.scenarios.forEach(x2=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="sw" style="background:${SC_COL[x2.id]}"></span>${x2.short} — ${x2.description}`;
    leg.appendChild(li);});}
}

function drawUncertainty(host,L,W,H,leg){
  const M={t:12,r:14,b:26,l:40};
  const s=SVG(W,H), U=L.uncertainty;
  const x=sc(U[0].year,U[U.length-1].year,M.l,W-M.r), y=sc(0,1,H-M.b,M.t);
  const layers=[['internal','var(--s1)','Internal variability — weather noise'],
                ['parameter','var(--s3)','Parameter — what 100 years can pin down'],
                ['scenario','var(--s2)','Scenario — which path the world takes']];
  [0,.5,1].forEach(t=>{
    E('line',{x1:M.l,x2:W-M.r,y1:y(t),y2:y(t),class:'gridline'},s);
    E('text',{x:M.l-7,y:y(t)+4,class:'axis','text-anchor':'end'},s).textContent=(t*100)+'%';
  });
  [2050,2075,2100,2125].forEach(yr=>E('text',{x:x(yr),y:H-M.b+16,class:'axis','text-anchor':'middle'},s).textContent=yr);
  let base=U.map(()=>0);
  layers.forEach(([k,col],i)=>{
    const top=U.map((d,j)=>base[j]+d[k]);
    const pts=U.map((d,j)=>[x(d.year),y(top[j])]).concat(
      U.slice().reverse().map((d,j)=>[x(d.year),y(base[U.length-1-j])]));
    const p=E('path',{d:P(pts)+'Z',fill:col,'fill-opacity':.85,stroke:'var(--panel)','stroke-width':1.2},s);
    if(!reduce) p.animate([{opacity:0},{opacity:1}],{duration:600,delay:i*130,fill:'backwards'});
    base=top;
  });
  const cross=U.find(d=>d.scenario>d.internal);
  if(cross){
    E('line',{x1:x(cross.year),x2:x(cross.year),y1:M.t,y2:H-M.b,stroke:'var(--ink)',
      'stroke-width':1.3,'stroke-dasharray':'3 3','stroke-opacity':.7},s);
    E('text',{x:x(cross.year)+6,y:M.t+12,class:'axis',fill:'var(--ink)','font-weight':'660'},s)
      .textContent=`${cross.year} — scenario overtakes noise`;
  }
  drawIn(host,s);
  if(leg){leg.innerHTML='';layers.forEach(([k,c,lab])=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="sw" style="background:${c}"></span>${lab}`;leg.appendChild(li);});}
}

  const s=SVG(W,H), yrs=L.target_years;
  const isProb=p.measure==='probability';
  const all=D.scenarios.flatMap(x=>p.series[x.id]);
  const hi=isProb?Math.min(Math.max(...all,0.05)*1.3,1):Math.max(...all,1)*1.15;
  const x=sc(0,yrs.length-1,M.l,W-M.r), y=sc(0,hi,H-M.b,M.t);
  const tk=ticks(0,hi,3);
  tk.forEach(t=>{
    E('line',{x1:M.l,x2:W-M.r,y1:y(t),y2:y(t),class:'gridline'},s);
    E('text',{x:M.l-7,y:y(t)+4,class:'axis','text-anchor':'end'},s)
      .textContent=isProb?pct(t):fmtTick(t,tk.step);
  });
  yrs.forEach((yr,i)=>E('text',{x:x(i),y:H-M.b+16,class:'axis','text-anchor':'middle'},s).textContent=yr);
  E('line',{x1:M.l,x2:W-M.r,y1:H-M.b,y2:H-M.b,class:'axisline'},s);
  D.scenarios.forEach(s2=>{
    const pts=p.series[s2.id].map((v,i)=>[x(i),y(v)]);
    const path=E('path',{d:P(pts),fill:'none',stroke:SC_COL[s2.id],
      'stroke-width':s2.id===state.scenario?2.4:1.4,

  drawIn(host,s);
}

function drawWaterfall(host,q,W,H){
  const M={t:14,r:16,b:44,l:52};
  const s=SVG(W,H);
  const steps=[['Fair value',q.theo,'var(--s1)'],['Capital',q.loads.capital,'var(--s2)'],
    ['Model',q.loads.parameter,'var(--s4)'],['Basis',q.loads.basis,'var(--s3)'],
    ['Expense',q.loads.expense,'var(--muted)']];
  const total=steps.reduce((a,b)=>a+b[1],0);
  const y=sc(0,total*1.1,H-M.b,M.t);
  const bw=(W-M.l-M.r)/(steps.length+1)-8;
  let cum=0;
  ticks(0,total*1.1,4).forEach(t=>{
    E('line',{x1:M.l,x2:W-M.r,y1:y(t),y2:y(t),class:'gridline'},s);
    E('text',{x:M.l-7,y:y(t)+4,class:'axis','text-anchor':'end'},s).textContent=money(t);
  });
  steps.forEach(([lab,val,col],i)=>{
    const bx=M.l+i*((W-M.l-M.r)/(steps.length+1))+4;
    const y0=y(cum), y1=y(cum+val);
    const r=E('rect',{x:bx,y:y1,width:bw,height:Math.max(y0-y1,1),fill:col,rx:2},s);
    if(!reduce) r.animate([{transform:'scaleY(0)'},{transform:'scaleY(1)'}],
      {duration:520,delay:i*80,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'});
    r.style.transformOrigin=`${bx}px ${y0}px`;
    E('text',{x:bx+bw/2,y:H-M.b+15,class:'axis','text-anchor':'middle'},s).textContent=lab;
    E('text',{x:bx+bw/2,y:H-M.b+28,class:'axis','text-anchor':'middle'},s).textContent=money(val);
    cum+=val;
  });
  const bx=M.l+steps.length*((W-M.l-M.r)/(steps.length+1))+4;
  E('rect',{x:bx,y:y(cum),width:bw,height:(H-M.b)-y(cum),fill:'var(--accent)',rx:2},s);
  E('text',{x:bx+bw/2,y:H-M.b+15,class:'axis','text-anchor':'middle','font-weight':'660'},s).textContent='Mid';
  E('text',{x:bx+bw/2,y:H-M.b+28,class:'axis','text-anchor':'middle'},s).textContent=money(cum);
  drawIn(host,s);
}

/* ---------- utils ---------- */
function ticks(lo,hi,n){
  const span=hi-lo; if(!(span>0)) return [lo];
  const raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(v=>v>=raw)||mag*10;
  const out=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step) out.push(t);
  out.step=step;
  return out;
}
/** Decimals sized to the tick step, so a 0-to-1.4 axis stops printing "1, 1". */
function fmtTick(t,step){
  if(!(step>0)) return f(t,0);
  const d=Math.max(0,Math.min(3,Math.ceil(-Math.log10(step))+ (step<1?0:0)));
  return Number(t).toFixed(step>=1?0:d);
}
function monthName(m){return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1];}
function seasonLen(L){
  const [a,b]=L.season, len=[31,28,31,30,31,30,31,31,30,31,30,31];
  let n=0,m=a;
  for(;;){n+=len[m-1]; if(m===b) break; m=m%12+1;}
  return n;
}
function prettyTerm(n){
  const map={intercept:'Intercept',global:'Global temperature (amplification)',
    drift_per_century:'Station drift (frozen, not projected)'};
  return map[n]||n.replace(/^cos(\d)$/,'Seasonal cos $1').replace(/^sin(\d)$/,'Seasonal sin $1')
    .replace(/^global_cos(\d)$/,'Seasonal amplification cos $1')
    .replace(/^global_sin(\d)$/,'Seasonal amplification sin $1');
}
function lossAxisLabel(L){
  const v=L.loss_curve&&L.loss_curve.variable;
  return v==='tmax_c'?'daily maximum temperature (°C)'
       : v==='tmin_c'?'daily minimum temperature (°C)'
       : v==='wind_ms'?'daily mean wind (m/s)'
       : v==='snow_mm'?'daily snowfall (mm)'
       : 'daily rainfall (mm)';
}
function lossUnit(L){
  const v=L.loss_curve&&L.loss_curve.variable;
  return (v==='tmax_c'||v==='tmin_c')?'°C' : v==='wind_ms'?'m/s' : 'mm';
}

function sourceLabel(L){
  return L.provenance==='noaa-ghcnd' ? `station ${L.station}`
       : L.provenance==='era5-openmeteo' ? 'ERA5 reanalysis'
       : 'a calibrated surrogate';
}
function sourcePhrase(L){
  return L.provenance==='noaa-ghcnd'
    ? `at station ${L.station}`
    : L.provenance==='era5-openmeteo'
      ? `from ERA5 reanalysis at ${f(L.lat,3)}, ${f(L.lon,3)} — station ${L.station} does not cover the full century`
      : 'from a calibrated surrogate, not observations';
}

function noContractNotice(L,verb){
  return `<div class="vhead"><h1>Nothing to be ${verb} here</h1>
   <p>No peril at ${L.name.split(',')[0]} triggers often enough to underwrite. Writing cover on an
   event that never fires produces a premium made entirely of expenses and a payout of zero —
   so no quote is shown.</p></div>
   <div class="note"><b>What would change this.</b> A lower threshold, a longer accumulation
   window, or a different settlement variable. Those are product decisions rather than model
   decisions, so they are not chosen automatically.</div>`;
}

function qualityBanner(L){
  const q=L.quality;
  if(!q) return '';
  if(q.usable){
    if(!q.notes||!q.notes.length) return '';
    return `<div class="note" style="margin-bottom:16px">
      <b><span class="pill info">Note on the record</span></b>
      <div style="margin-top:7px">${q.notes.join(' ')}</div></div>`;
  }
  const cls=q.verdict==='unreliable'?'bad':'warn';
  return `<div class="note" style="border-left-color:var(--${q.verdict==='unreliable'?'crit':'serious'});margin-bottom:16px">
    <b><span class="pill ${cls}">${q.verdict==='unreliable'?'Do not quote':'Treat with caution'}</span></b>
    <div style="margin-top:7px">This site failed its quality gate. Numbers below are shown so the
    problem is visible, <b>not because they should be used</b>.</div>
    <ul style="margin:8px 0 0;padding-left:18px">${q.problems.map(p=>`<li>${p}</li>`).join('')}</ul>
    ${q.inhomogeneity&&q.inhomogeneity.detected?`<div style="margin-top:8px">The usual fix is pairwise
    homogenisation against neighbouring stations, which is not implemented here — so the honest
    action is to flag it rather than quote through it.</div>`:''}
  </div>`;
}

function provBadge(L){
  const real=L.provenance==='noaa-ghcnd'||L.provenance==='era5-openmeteo';
  const cls=real?'ok':'warn';
  const label=L.provenance==='noaa-ghcnd'?'NOAA GHCN-Daily observations'
    :L.provenance==='era5-openmeteo'?'ERA5 reanalysis':'Calibrated surrogate — not observations';
  let out=`<span class="pill ${cls}">${label}</span>`;
  if(L.coverage&&L.coverage.tmax_c!=null)
    out+=`<span class="pill info">temperature coverage ${pct(L.coverage.tmax_c)}</span>`;
  if(L.patched&&L.patched.length)
    out+=`<span class="pill warn">${L.patched.join(', ')} not measured at station — substituted</span>`;
  return out;
}

/* ---------- render ---------- */
const VIEWS={overview:view_overview,climate:view_climate,outlook:view_outlook,
  perils:view_perils,pricing:view_pricing,hedge:view_hedge,model:view_model};
function render(){
  const host=document.getElementById('view');
  host.innerHTML='';
  const banner=qualityBanner(state.loc);
  if(banner){
    const d=document.createElement('div'); d.innerHTML=banner; host.appendChild(d.firstElementChild);
  }
  host.appendChild(VIEWS[state.tab](state.loc));
}
document.getElementById('yearOut').textContent=state.loc.target_years[0];
pushWeather();
render();
</script>
